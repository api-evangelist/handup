aid: handup
name: HandUp
description: HandUp is a San Francisco-based public-benefit crowdfunding platform that makes giving to
  nonprofit organizations and the people they serve easy, secure, and transparent. Launched in 2013 and
  backed by 500 Global and Version One Ventures, HandUp partners with 501(c)(3) nonprofits whose mission
  is to serve people experiencing poverty and homelessness. Donors give directly to individual campaigns
  or to pooled funds such as the National Fund and the HandUp Fund; partner nonprofits then distribute the
  donations to cover basics like food, clothing, and housing, and report progress and metrics back to donors.
